name: Ping stock refresh

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    name: Ask the site to refresh stock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh stock on the site
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 \
            "https://precisionhardware.net/api/stock-refresh"

      - name: Keep this schedule from going idle
        shell: bash
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -lt 86400 ]; then
            exit 0
          fi
          git config user.name "stock timer"
          git config user.email "stock-timer@users.noreply.github.com"
          git commit --allow-empty -m "Keep the stock timer scheduled."
          git push
